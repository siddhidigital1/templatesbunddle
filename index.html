  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      padding: 14px 10px;
    }

    .filter-section {
      max-width: 1200px;
      margin: 0 auto 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .search-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    .search-input:focus {
      border-color: #38bdf8;
    }

    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      padding: 8px 16px;
      border-radius: 20px;
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      font-size: 0.82rem;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
      font-weight: 700;
    }

    .counter {
      font-size: 0.82rem;
      color: #94a3b8;
      text-align: right;
      max-width: 1200px;
      margin: 0 auto 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 1200px;
      margin: 0 auto;
    }
    @media (min-width: 768px) {
      .grid { grid-template-columns: repeat(4, 1fr); }
    }

    .card {
      background: #1e293b;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }
    .card:active {
      transform: scale(0.98);
    }

    .media-box {
      width: 100%;
      aspect-ratio: 9 / 16;
      background: #020617;
      position: relative;
    }
    .media-box img,
    .media-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }
    .play-badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-size: 0.65rem;
      padding: 3px 6px;
      border-radius: 4px;
    }

    .card-title {
      padding: 8px;
      font-size: 0.76rem;
      color: #e2e8f0;
      line-height: 1.3;
      font-weight: 500;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.96);
      z-index: 999999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal.active { display: flex; }
    .modal-content {
      max-width: 90vw;
      max-height: 76vh;
      border-radius: 12px;
      overflow: hidden;
    }
    .modal-content video, .modal-content img {
      width: 100%;
      max-height: 76vh;
      object-fit: contain;
    }
    .modal-title {
      margin-top: 14px;
      font-size: 0.9rem;
      color: #f8fafc;
      text-align: center;
    }
    .close-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: none;
      font-size: 1.8rem;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
  </style>

    let currentCategory = "all";
    let currentSearch = "";

    const grid = document.getElementById("grid");
    const searchInput = document.getElementById("searchInput");
    const tabBtns = document.querySelectorAll(".tab-btn");
    const modal = document.getElementById("modalView");
    const modalMedia = document.getElementById("modalMedia");
    const modalTitle = document.getElementById("modalTitle");
    const closeModal = document.getElementById("closeModal");
    const itemCount = document.getElementById("itemCount");

    function renderCards() {
      grid.innerHTML = "";
      const filtered = templates.filter(t => {
        const matchesCategory = currentCategory === "all" || t.category === currentCategory;
        const matchesSearch = t.title.toLowerCase().includes(currentSearch);
        return matchesCategory && matchesSearch;
      });

      itemCount.textContent = `Showing ${filtered.length} of ${templates.length} templates`;

      filtered.forEach(t => {
        const card = document.createElement("div");
        card.className = "card";

        const media = t.isVideo
          ? `<video src="${t.src}" loop muted playsinline autoplay></video>`
          : `<img src="${t.src}" alt="${t.title}" loading="lazy" />`;

        card.innerHTML = `
          <div class="media-box">
            ${media}
            <span class="play-badge">${t.isVideo ? '▶ Play' : '🔍 View'}</span>
          </div>
          <div class="card-title">${t.title}</div>
        `;

        card.addEventListener("click", () => {
          modalMedia.innerHTML = t.isVideo
            ? `<video src="${t.src}" controls autoplay playsinline></video>`
            : `<img src="${t.src}" alt="${t.title}">`;
          modalTitle.textContent = t.title;
          modal.classList.add("active");
        });

        grid.appendChild(card);
      });
    }

    tabBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        tabBtns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentCategory = btn.dataset.category;
        renderCards();
      });
    });

    searchInput.addEventListener("input", (e) => {
      currentSearch = e.target.value.toLowerCase();
      renderCards();
    });

    function hideModal() {
      modal.classList.remove("active");
      modalMedia.innerHTML = "";
    }
    closeModal.addEventListener("click", hideModal);
    modal.addEventListener("click", (e) => {
      if (e.target === modal) hideModal();
    });

    renderCards();
  </script>
