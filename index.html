<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Templates Showcase</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      padding: 14px 10px 40px;
    }

    /* Top Bar */
    .top-bar {
      max-width: 1200px;
      margin: 0 auto 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .top-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 0.5px;
    }
    .admin-trigger-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .admin-trigger-btn:hover {
      color: #f8fafc;
      border-color: #38bdf8;
    }

    /* Search & Filter Section */
    .filter-section {
      max-width: 1200px;
      margin: 0 auto 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .search-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    .search-input:focus {
      border-color: #38bdf8;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      padding: 8px 16px;
      border-radius: 20px;
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      font-size: 0.82rem;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
      font-weight: 700;
    }

    .counter {
      font-size: 0.82rem;
      color: #94a3b8;
      text-align: right;
      max-width: 1200px;
      margin: 0 auto 10px;
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 1200px;
      margin: 0 auto;
    }
    @media (min-width: 768px) {
      .grid { grid-template-columns: repeat(4, 1fr); }
    }

    .card {
      background: #1e293b;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
    }
    .card:active {
      transform: scale(0.98);
    }

    .media-box {
      width: 100%;
      aspect-ratio: 9 / 16;
      background: #020617;
      position: relative;
    }
    .media-box img,
    .media-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }
    .play-badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-size: 0.65rem;
      padding: 3px 6px;
      border-radius: 4px;
    }

    .card-title {
      padding: 8px;
      font-size: 0.76rem;
      color: #e2e8f0;
      line-height: 1.3;
      font-weight: 500;
    }

    /* Lightbox Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.96);
      z-index: 99999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal.active { display: flex; }
    .modal-content {
      max-width: 90vw;
      max-height: 76vh;
      border-radius: 12px;
      overflow: hidden;
    }
    .modal-content video, .modal-content img {
      width: 100%;
      max-height: 76vh;
      object-fit: contain;
    }
    .modal-title {
      margin-top: 14px;
      font-size: 0.9rem;
      color: #f8fafc;
      text-align: center;
    }
    .close-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: none;
      font-size: 1.8rem;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Admin Overlay */
    .admin-drawer {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.98);
      z-index: 100000;
      overflow-y: auto;
      padding: 20px 14px;
    }
    .admin-drawer.active { display: block; }
    .admin-container {
      max-width: 700px;
      margin: 0 auto;
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
    }
    .admin-header h2 {
      color: #38bdf8;
      font-size: 1.3rem;
    }
    .admin-close {
      background: #334155;
      color: #fff;
      border: none;
      font-size: 1.2rem;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
    }
    .admin-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 5px;
    }
    .admin-input, .admin-select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }
    .admin-input:focus, .admin-select:focus {
      border-color: #38bdf8;
    }
    .admin-btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.88rem;
    }
    .btn-blue { background: #38bdf8; color: #0f172a; }
    .btn-green { background: #10b981; color: #fff; }
    .btn-red { background: #ef4444; color: #fff; }
    .btn-gray { background: #475569; color: #fff; }

    .admin-action-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .admin-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .admin-item {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .admin-item-info {
      flex: 1;
      overflow: hidden;
    }
    .admin-item-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .admin-item-meta {
      font-size: 0.72rem;
      color: #94a3b8;
      margin-top: 3px;
    }
    .admin-item-btns {
      display: flex;
      gap: 6px;
    }
    .admin-item-btns button {
      padding: 6px 10px;
      font-size: 0.75rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header class="top-bar">
    <div class="top-title">Templates Showcase</div>
    <button class="admin-trigger-btn" id="openAdminBtn">⚙️ Admin Login</button>
  </header>

  <!-- Search & Category Tabs -->
  <section class="filter-section">
    <input type="text" id="searchInput" class="search-input" placeholder="Search templates (e.g. Kedarnath, Marathi, Royal)..." />
    <div class="tabs">
      <button class="tab-btn active" data-category="all">All</button>
      <button class="tab-btn" data-category="wedding">Wedding & Engagement</button>
      <button class="tab-btn" data-category="birthday">Birthday</button>
      <button class="tab-btn" data-category="festival">Festival & Pooja</button>
      <button class="tab-btn" data-category="business">Business & Posters</button>
    </div>
  </section>

  <div class="counter" id="itemCount">Loading templates...</div>
  <main class="grid" id="grid"></main>

  <!-- Lightbox Modal -->
  <div class="modal" id="modalView">
    <button class="close-btn" id="closeModal">&times;</button>
    <div class="modal-content" id="modalMedia"></div>
    <div class="modal-title" id="modalTitle"></div>
  </div>

  <!-- Admin Panel Drawer -->
  <div class="admin-drawer" id="adminDrawer">
    <div class="admin-container">
      <div class="admin-header">
        <h2>Admin Management Panel</h2>
        <button class="admin-close" id="closeAdminBtn">&times;</button>
      </div>

      <!-- Add/Edit Form -->
      <div class="admin-card">
        <h3 id="formModeTitle" style="font-size: 1rem; color: #38bdf8; margin-bottom: 12px;">Add New Template</h3>
        <input type="hidden" id="editIndex" value="-1" />
        
        <div class="form-group">
          <label>Template Title</label>
          <input type="text" id="adminTitle" class="admin-input" placeholder="e.g. Kedarnath Theme Engagement Video" required />
        </div>

        <div class="form-group">
          <label>Category</label>
          <select id="adminCategory" class="admin-select">
            <option value="wedding">Wedding & Engagement</option>
            <option value="birthday">Birthday</option>
            <option value="festival">Festival & Pooja</option>
            <option value="business">Business & Posters</option>
          </select>
        </div>

        <div class="form-group">
          <label>Media Direct URL (.mp4 / .webp / .jpg / .png)</label>
          <input type="url" id="adminSrc" class="admin-input" placeholder="https://media.craftyartapp.com/...mp4" required />
        </div>

        <div class="form-group">
          <label>Media Format</label>
          <select id="adminIsVideo" class="admin-select">
            <option value="true">Video (MP4)</option>
            <option value="false">Static Image (JPG / PNG / WEBP)</option>
          </select>
        </div>

        <div class="admin-action-bar">
          <button class="admin-btn btn-blue" id="saveTemplateBtn">Save Template</button>
          <button class="admin-btn btn-gray" id="cancelEditBtn" style="display: none;">Cancel Edit</button>
          <button class="admin-btn btn-green" id="exportCodeBtn">📋 Export Updated JSON</button>
        </div>
      </div>

      <!-- List in Admin View -->
      <h3 style="font-size: 1rem; color: #94a3b8; margin-bottom: 12px;">Active Templates (<span id="adminTotalCount">0</span>)</h3>
      <div class="admin-list" id="adminList"></div>
    </div>
  </div>

  <script>
    // 1. Password Config
    const ADMIN_PASSWORD = "admin123";

    // 2. PASTE AREA FOR 131 TEMPLATES
    // Keep empty array [] if you haven't pasted yet; it will safely load default templates
    const rawTemplates = 
/* PASTE_131_JSON_START */
[]
/* PASTE_131_JSON_END */
    ;

    function getAutoCategory(title) {
      const t = (title || "").toLowerCase();
      if (t.includes("wedding") || t.includes("vivah") || t.includes("engagement") || t.includes("save the date") || t.includes("ring") || t.includes("haldi") || t.includes("sangeet") || t.includes("reception") || t.includes("kankotri")) return "wedding";
      if (t.includes("birthday") || t.includes("cinderella") || t.includes("balloon") || t.includes("baby") || t.includes("naming") || t.includes("barse") || t.includes("cradle") || t.includes("shaving")) return "birthday";
      if (t.includes("ganpati") || t.includes("ganesh") || t.includes("pooja") || t.includes("janmashtami") || t.includes("dahi handi") || t.includes("housewarming") || t.includes("vastu") || t.includes("diwali") || t.includes("navratri") || t.includes("festival")) return "festival";
      return "business";
    }

    // Default starter batch if rawTemplates is empty
    const fallbackTemplates = [
      { title: "Engagement Invitation Video with Kedarnath Theme", category: "wedding", src: "https://media.craftyartapp.com/uploadedFiles/v/e441d978117f912ad34a07db889efc07996a37191787810577.mp4", isVideo: true },
      { title: "Wedding Save The Date Video with Royal Palace Theme", category: "wedding", src: "https://media.craftyartapp.com/uploadedFiles/v/c8b0a95a602c4eac078812876cb65e6a2ea5da741783332173.mp4", isVideo: true },
      { title: "Wedding Invitation Video with Traditional Indian Theme", category: "wedding", src: "https://media.craftyartapp.com/uploadedFiles/v/d1f20da8510e234b1a61b83434125e9483a53a101782208273.mp4", isVideo: true },
      { title: "3d Indian Wedding Invitation Video with Royal Rajput Theme", category: "wedding", src: "https://media.craftyartapp.com/uploadedFiles/v/7ca50e04afabc51770bf7091dbb1d985a99b7ab31780461685.mp4", isVideo: true },
      { title: "Beautiful Wedding Invitation Video with Caricature Theme", category: "wedding", src: "https://media.craftyartapp.com/uploadedFiles/v/8d60292a1be30514ac7b867f3afe4b3b04fd60db1779538473.mp4", isVideo: true },
      { title: "3D Wedding Invitation Video Udaipur Palace Theme Invite", category: "wedding", src: "https://media.craftyartapp.com/uploadedFiles/v/707af7668162066a9880b3aef75f1ee1635723ed1776771535.mp4", isVideo: true },
      { title: "Marathi Wedding Invitation Video Shubh Vivah Invite", category: "wedding", src: "https://media.craftyartapp.com/uploadedFiles/v/025bbd83f353d849fbf73b534823d3d178667dc41775737040.mp4", isVideo: true },
      { title: "1st Birthday Invitation Video with Balloon Theme", category: "birthday", src: "https://media.craftyartapp.com/uploadedFiles/v/4d49350dd5f156986c8f7a43da4402c19b60a6231784194839.mp4", isVideo: true },
      { title: "Ganpati Invitation Card in Marathi Template Design", category: "festival", src: "https://media.craftyartapp.com/uploadedFiles/thumb_file/1e1361f2d79f35eeff74d4fb993af82d141743731754914803.jpg", isVideo: false },
      { title: "Girl Cinderella Birthday Invitation Template", category: "birthday", src: "https://media.craftyartapp.com/uploadedFiles/thumb_file/bc936b96c47cb0fa39ab9b7f63876b2a67f2f57e1734001731.jpg", isVideo: false },
      { title: "Best Summer Camp Poster For Kids", category: "business", src: "https://media.craftyartapp.com/uploadedFiles/thumb_file/2f02c460ab5643672f144f8167dc4c3b7e2748c01744031128.png", isVideo: false },
      { title: "Corporate Resignation Letter Template", category: "business", src: "https://media.craftyartapp.com/uploadedFiles/thumb_file/f7e9443e5c46a3654c0d61b1e11e2cab332a630c1724991609.jpg", isVideo: false }
    ];

    let baseData = (Array.isArray(rawTemplates) && rawTemplates.length > 0) ? rawTemplates : fallbackTemplates;

    let activeTemplates = JSON.parse(localStorage.getItem("admin_managed_templates")) || baseData.map((item, idx) => ({
      id: idx + 1,
      title: item.title,
      src: item.src,
      isVideo: !!item.isVideo,
      category: item.category || getAutoCategory(item.title)
    }));

    // 3. Render Client Grid
    const grid = document.getElementById("grid");
    const searchInput = document.getElementById("searchInput");
    const tabBtns = document.querySelectorAll(".tab-btn");
    const itemCount = document.getElementById("itemCount");
    const modal = document.getElementById("modalView");
    const modalMedia = document.getElementById("modalMedia");
    const modalTitle = document.getElementById("modalTitle");
    const closeModal = document.getElementById("closeModal");

    let currentCategory = "all";
    let currentSearch = "";

    function renderClientGrid() {
      grid.innerHTML = "";
      const filtered = activeTemplates.filter(t => {
        const matchesCategory = currentCategory === "all" || t.category === currentCategory;
        const matchesSearch = t.title.toLowerCase().includes(currentSearch);
        return matchesCategory && matchesSearch;
      });

      itemCount.textContent = `Showing ${filtered.length} of ${activeTemplates.length} templates`;

      filtered.forEach(t => {
        const card = document.createElement("div");
        card.className = "card";

        const media = t.isVideo
          ? `<video src="${t.src}" loop muted playsinline autoplay></video>`
          : `<img src="${t.src}" alt="${t.title}" loading="lazy" />`;

        card.innerHTML = `
          <div class="media-box">
            ${media}
            <span class="play-badge">${t.isVideo ? '▶ Play' : '🔍 View'}</span>
          </div>
          <div class="card-title">${t.title}</div>
        `;

        card.addEventListener("click", () => {
          modalMedia.innerHTML = t.isVideo
            ? `<video src="${t.src}" controls autoplay playsinline></video>`
            : `<img src="${t.src}" alt="${t.title}">`;
          modalTitle.textContent = t.title;
          modal.classList.add("active");
        });

        grid.appendChild(card);
      });
    }

    tabBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        tabBtns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentCategory = btn.dataset.category;
        renderClientGrid();
      });
    });

    searchInput.addEventListener("input", (e) => {
      currentSearch = e.target.value.toLowerCase();
      renderClientGrid();
    });

    function hideModal() {
      modal.classList.remove("active");
      modalMedia.innerHTML = "";
    }
    closeModal.addEventListener("click", hideModal);
    modal.addEventListener("click", (e) => {
      if (e.target === modal) hideModal();
    });

    // 4. Admin Management Logic
    const openAdminBtn = document.getElementById("openAdminBtn");
    const closeAdminBtn = document.getElementById("closeAdminBtn");
    const adminDrawer = document.getElementById("adminDrawer");
    const adminList = document.getElementById("adminList");
    const adminTotalCount = document.getElementById("adminTotalCount");

    const formModeTitle = document.getElementById("formModeTitle");
    const editIndexInput = document.getElementById("editIndex");
    const adminTitle = document.getElementById("adminTitle");
    const adminCategory = document.getElementById("adminCategory");
    const adminSrc = document.getElementById("adminSrc");
    const adminIsVideo = document.getElementById("adminIsVideo");
    const saveTemplateBtn = document.getElementById("saveTemplateBtn");
    const cancelEditBtn = document.getElementById("cancelEditBtn");
    const exportCodeBtn = document.getElementById("exportCodeBtn");

    let isAdminLoggedIn = false;

    function promptAdminLogin() {
      if (isAdminLoggedIn) {
        openAdminPanel();
        return;
      }
      const pass = prompt("Enter Admin Password:");
      if (pass === ADMIN_PASSWORD) {
        isAdminLoggedIn = true;
        openAdminPanel();
      } else if (pass !== null) {
        alert("Incorrect password!");
      }
    }

    function openAdminPanel() {
      renderAdminList();
      adminDrawer.classList.add("active");
    }

    function closeAdminPanel() {
      adminDrawer.classList.remove("active");
      resetAdminForm();
    }

    openAdminBtn.addEventListener("click", promptAdminLogin);
    closeAdminBtn.addEventListener("click", closeAdminPanel);

    window.addEventListener("keydown", (e) => {
      if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "a") {
        e.preventDefault();
        promptAdminLogin();
      }
    });

    function renderAdminList() {
      adminList.innerHTML = "";
      adminTotalCount.textContent = activeTemplates.length;

      activeTemplates.forEach((t, idx) => {
        const item = document.createElement("div");
        item.className = "admin-item";
        item.innerHTML = `
          <div class="admin-item-info">
            <div class="admin-item-title">${idx + 1}. ${t.title}</div>
            <div class="admin-item-meta">${t.category.toUpperCase()} • ${t.isVideo ? 'VIDEO' : 'IMAGE'}</div>
          </div>
          <div class="admin-item-btns">
            <button class="btn-blue" onclick="startEditTemplate(${idx})">Edit</button>
            <button class="btn-red" onclick="deleteTemplate(${idx})">Delete</button>
          </div>
        `;
        adminList.appendChild(item);
      });
    }

    function saveState() {
      localStorage.setItem("admin_managed_templates", JSON.stringify(activeTemplates));
      renderClientGrid();
      renderAdminList();
    }

    window.startEditTemplate = function(idx) {
      const item = activeTemplates[idx];
      editIndexInput.value = idx;
      adminTitle.value = item.title;
      adminCategory.value = item.category;
      adminSrc.value = item.src;
      adminIsVideo.value = item.isVideo ? "true" : "false";

      formModeTitle.textContent = `Edit Template #${idx + 1}`;
      saveTemplateBtn.textContent = "Update Template";
      cancelEditBtn.style.display = "inline-block";
      adminTitle.scrollIntoView({ behavior: "smooth" });
    };

    function resetAdminForm() {
      editIndexInput.value = "-1";
      adminTitle.value = "";
      adminSrc.value = "";
      formModeTitle.textContent = "Add New Template";
      saveTemplateBtn.textContent = "Save Template";
      cancelEditBtn.style.display = "none";
    }

    cancelEditBtn.addEventListener("click", resetAdminForm);

    saveTemplateBtn.addEventListener("click", () => {
      const title = adminTitle.value.trim();
      const category = adminCategory.value;
      const src = adminSrc.value.trim();
      const isVideo = adminIsVideo.value === "true";
      const editIdx = parseInt(editIndexInput.value, 10);

      if (!title || !src) {
        alert("Please provide both Title and Media URL.");
        return;
      }

      if (editIdx >= 0) {
        activeTemplates[editIdx] = { ...activeTemplates[editIdx], title, category, src, isVideo };
      } else {
        activeTemplates.unshift({ id: Date.now(), title, category, src, isVideo });
      }

      saveState();
      resetAdminForm();
    });

    window.deleteTemplate = function(idx) {
      if (confirm(`Are you sure you want to delete "${activeTemplates[idx].title}"?`)) {
        activeTemplates.splice(idx, 1);
        saveState();
        if (parseInt(editIndexInput.value, 10) === idx) {
          resetAdminForm();
        }
      }
    };

    exportCodeBtn.addEventListener("click", () => {
      const exportData = activeTemplates.map(({ title, src, isVideo, category }) => ({ title, src, isVideo, category }));
      const jsonString = JSON.stringify(exportData, null, 2);
      navigator.clipboard.writeText(jsonString).then(() => {
        alert("Copied all current templates as JSON!\n\nYou can paste this into GitHub inside rawTemplates = [ ... ] to keep changes permanent.");
      }).catch(() => {
        prompt("Copy this JSON data manually:", jsonString);
      });
    });

    renderClientGrid();
  </script>
</body>
</html>
